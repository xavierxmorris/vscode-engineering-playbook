# PR Checks — Reusable test workflow + parallel lint/test matrix
# Adapted from microsoft/vscode's CI architecture

name: PR Checks
on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies (with retry)
        run: |
          for i in 1 2 3; do
            npm ci && break
            echo "Attempt $i failed, retrying..."
            sleep 2
          done
      - name: Lint (warnings = errors)
        run: npx eslint . --max-warnings 0
      - name: Format check
        run: npx prettier --check "src/**/*.{ts,tsx,js,json}"
      - name: Typecheck
        run: npx tsc --noEmit
      # Optional: architecture validation
      # - name: Validate layers
      #   run: npx depcruise src --config .dependency-cruiser.cjs

  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        shard: [1, 2]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run unit tests (shard ${{ matrix.shard }}/2)
        run: npx vitest run --shard ${{ matrix.shard }}/2
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.os }}-shard${{ matrix.shard }}-${{ github.run_attempt }}
          path: test-results/
          retention-days: 7
      - name: Upload crash dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-dump-${{ matrix.os }}-shard${{ matrix.shard }}-${{ github.run_attempt }}
          path: .build/crashes/
          retention-days: 14

  integration-tests:
    needs: [lint-and-typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run integration tests
        run: npm run test:integration
